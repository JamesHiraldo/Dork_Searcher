name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Tests
        run: python -m pytest -q
      - name: Ruff
        run: python -m ruff check src tests
      - name: MyPy
        run: python -m mypy src

  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build Windows release
        shell: pwsh
        run: ./scripts/build_windows.ps1 -PythonCommand python
      - name: Offline frozen executable smoke test
        run: python scripts/release_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            Wayback_Atlas_App/wayback_atlas.exe
            Wayback_Atlas_App/wayback_atlas-3.2.0-py3-none-any.whl
            Wayback_Atlas_App/SHA256SUMS.txt

