[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dork-searcher"
version = "2.0.0"
description = "Scope-aware search, Wayback, CT discovery, and HTTP reconnaissance toolkit"
readme = "docs/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Maydayx2"}
]
keywords = ["dork", "searcher", "reconnaissance", "subdomain", "endpoint", "passive"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Topic :: Internet",
    "Topic :: Security",
]

dependencies = [
    "requests>=2.32.4,<3",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.9",
    "mypy>=1.11",
]
browser = [
    "playwright>=1.54,<2",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
dork_searcher = "src.cli:main"
dork-search = "src.searcher:main"
wayback-recon = "src.recon_pipeline:main"
http-metadata-probe = "src.passive_probe:main"

[project.urls]
Homepage = "https://github.com/Maydayx2/dork-searcher"
Documentation = "https://github.com/Maydayx2/dork-searcher/blob/main/docs/README.md"
Repository = "https://github.com/Maydayx2/dork-searcher.git"
Issues = "https://github.com/Maydayx2/dork-searcher/issues"

[tool.setuptools]
packages = ["src"]
include-package-data = true

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
