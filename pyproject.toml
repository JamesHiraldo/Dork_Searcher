[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wayback-recon"
version = "4.0.1"
description = "Wayback and subdomain discovery with persistent DNS and HTTP availability history"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Maydayx2"}
]
keywords = ["dork", "searcher", "reconnaissance", "subdomain", "endpoint", "passive"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "Topic :: Internet",
    "Topic :: Security",
]

dependencies = [
    "requests>=2.32.4,<3",
    "httpx>=0.27,<1",
    "rich>=13.9,<15",
    "dnspython>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.9",
    "mypy>=1.11",
]
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
wayback-recon = "src.cli:main"
wayback-atlas = "src.cli:main"
dork_searcher = "src.cli:main"
dork-search = "src.searcher:main"
wayback-parameters = "src.recon_pipeline:main"
http-metadata-probe = "src.passive_probe:main"

[project.urls]
Homepage = "https://github.com/JamesHiraldo/Wayback-Recon"
Documentation = "https://github.com/JamesHiraldo/Wayback-Recon/blob/main/README.md"
Repository = "https://github.com/JamesHiraldo/Wayback-Recon.git"
Issues = "https://github.com/JamesHiraldo/Wayback-Recon/issues"

[tool.setuptools]
packages = ["src"]
include-package-data = true

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
